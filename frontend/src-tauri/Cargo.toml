[package]
name = "x-assistant"
version = "1.0.0"
description = "Windows Local AI Desktop Assistant & Developer Productivity Copilot"
authors = ["Joel Junior <joeljunior0912@gmail.com>"]
license = "MIT"
repository = "https://github.com/xouel/xouel-assistant"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
